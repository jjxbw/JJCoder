[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jjcoder"
version = "0.1.0"
description = "Minimal AI coding agent from corecoder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jjxbw", email = "2450990869@qq.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["jjcoder"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
sql = ["psycopg[binary]>=3.2", "PyMySQL>=1.1"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
jjcoder = "jjcoder.cli:main"


[tool.ruff]
line-length = 130
target-version = "py310"
